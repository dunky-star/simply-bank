name: ci-test

on:
  push:
    branches: [ main ]      # your repo uses master; change to main if you rename it
  pull_request:
    branches: [ main ]

permissions:
  contents: read              # least-privilege GITHUB_TOKEN

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true    # cancel outdated runs on new pushes

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10       # fail fast if something hangs

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: simple_bank
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Replaces your gitignored .env in CI — Make picks these up automatically
    env:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secret
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: simple_bank

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install golang-migrate
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.12.2/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/bin/migrate
          which migrate

      - name: Run migrations
        run: make migrateup

      - name: Test
        run: make test