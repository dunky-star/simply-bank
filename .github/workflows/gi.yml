name: ci-test

on:
  push:
    branches: [ main ]        # keep "master" if that's your default branch
  pull_request:
    branches: [ main ]

permissions:
  contents: read              # least-privilege GITHUB_TOKEN

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true    # cancel outdated runs on new pushes

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10       # don't let hung jobs burn minutes

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: simple_bank
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod   # Go version comes from your project

      - name: Run migrations
        run: make migrateup

      - name: Test
        run: make test