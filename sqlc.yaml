version: "2"
sql:
  - schema: "./db/migration/"
    queries: "./db/query/"
    engine: "postgresql"
    gen:
      go:
        package: "db"
        out: "./db/sqlc"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        overrides:
          - column: "accounts.balance"
            go_type: "github.com/shopspring/decimal.Decimal"
          - column: "entries.amount"
            go_type: "github.com/shopspring/decimal.Decimal"
          - column: "transfers.amount"
            go_type: "github.com/shopspring/decimal.Decimal"
